# security.yml — Static security checks on every push and pull request
#
# Four jobs run in parallel:
#   1. gitleaks   — scans git history for accidentally committed secrets
#   2. semgrep    — static analysis for insecure code patterns
#   3. trivy      — scans Docker images for known CVEs
#   4. unit-tests — alarm logic, audit log, acknowledgement behaviour

name: Security

# Trigger on every push to any branch, and on pull requests targeting trunk
on:
  push:
  pull_request:
    branches: [trunk]

jobs:

  # ── 1. Gitleaks — Secret Scanning ──────────────────────────────────────────
  # Gitleaks walks the entire git history looking for things that look like
  # secrets: API keys, tokens, passwords, private keys etc.
  # It uses regex patterns maintained by the Gitleaks project.
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history so Gitleaks can scan all past commits,
          # not just the latest snapshot
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Semgrep — Static Application Security Testing (SAST) ────────────────
  # Semgrep analyses source code without running it, matching patterns that
  # indicate security bugs (e.g. SQL injection, hardcoded creds, unsafe deserialization).
  # We run two rule sets:
  #   - p/python        : general Python security rules
  #   - p/owasp-top-ten : maps findings to OWASP Top 10 categories
  # Plus our own custom ICS rules in .semgrep/ics-security.yml
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        # semgrep scan analyses code locally — no account or token needed.
        # --error makes the job fail if any findings are found.
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config .semgrep/ics-security.yml \
            --error

  # ── 3. Trivy — Container Vulnerability Scanning ────────────────────────────
  # Trivy scans Docker images for CVEs in OS packages and language dependencies.
  # We build the backend image locally (no push needed) and scan it.
  # severity HIGH and CRITICAL will fail the build; MEDIUM and below are reported only.
  trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t scada-backend:ci ./backend

      - name: Run Trivy on backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scada-backend:ci
          format: table
          # Fail the workflow if any HIGH or CRITICAL CVEs are found
          exit-code: "1"
          severity: HIGH,CRITICAL
          # Ignore CVEs that have no fix available yet — unfixable vulns just
          # add noise without being actionable
          ignore-unfixed: true

  # ── 4. Unit Tests — Alarm Logic and Audit Log ──────────────────────────────
  # Tests the security-relevant behaviour of the plant monitoring system:
  # alarm thresholds, debounce logic, acknowledgement persistence, and audit
  # log correctness. No Factory.io, InfluxDB, or network connection required.
  #
  # These tests catch regressions — if someone changes a threshold or breaks
  # the alarm logic, CI fails immediately before it reaches production.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest --quiet

      - name: Run unit tests
        run: pytest backend/tests/ -v
        env:
          MOCK_MODE: "true"
          API_KEY: "test-key"
          INFLUX_URL: "http://localhost:8086"
          INFLUX_TOKEN: "dummy"
          INFLUX_ORG: "scadasim"
          INFLUX_BUCKET: "plant_data"

