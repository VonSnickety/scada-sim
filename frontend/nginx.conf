server {
    listen 80;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Serve the React app — try files first, fall back to index.html
    # so React Router can handle client-side navigation
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/ calls to the backend container
    location /api/ {
        proxy_pass http://backend:8000/api/;
        # Use the upstream hostname directly rather than passing through the
        # client's Host header — prevents Host header injection attacks
        proxy_set_header Host backend;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
